# Render Blueprint — auto-deploys the backend.
# This file MUST live at the REPOSITORY ROOT for Render to detect it.
services:
  - type: web
    name: ai-interviewer-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    healthCheckPath: /api/v1/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

