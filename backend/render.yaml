services:
  - type: web
    name: ai-interviewer-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      # Comma-separated list of allowed CORS origins (frontend URLs).
      - key: CORS_ORIGINS
        sync: false

